[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synthetic-participants"
version = "0.1.0"
description = "Generate richly profiled synthetic UX research participants with behavioural depth"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "rich>=13.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.25"]
openai   = ["openai>=1.0"]
gemini   = ["google-generativeai>=0.5"]
all      = ["anthropic>=0.25", "openai>=1.0", "google-generativeai>=0.5"]
dev      = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
synthetic-participants = "synthetic_participants.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["synthetic_participants*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
